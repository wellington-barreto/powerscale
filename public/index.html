<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="application-name" content="POWER SCALE" />
    <title>POWER SCALE</title>
    <link rel="icon" href="/assets/power-scale-icon.svg" type="image/svg+xml" />
    <!-- CSS original da interface. Mantido remoto temporariamente porque o ZIP de assets recebido continha páginas de bloqueio do Cloudflare em vez dos binários reais. -->
    <link rel="stylesheet" href="https://app.fenixscale.tech/assets/index-CGdexK4u.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Supabase OAuth callback: stores the access token in the key expected by the original POWER SCALE UI.
      (function () {
        if (location.pathname !== "/auth/callback") return;
        var h = new URLSearchParams(location.hash.replace(/^#/, ""));
        var q = new URLSearchParams(location.search);
        var token = h.get("access_token") || q.get("access_token") || q.get("token");
        if (token) {
          localStorage.setItem("sf_token", token);
          history.replaceState(null, "", "/dashboard");
          location.replace("/dashboard");
        }
      })();
    </script>
    <script src="/assets/power-scale-currency.js"></script>
    <script src="/assets/power-scale-appscript-settings.js"></script>
    <script type="module" src="/assets/index-POWER-SCALE.js"></script>
  </body>
</html>
